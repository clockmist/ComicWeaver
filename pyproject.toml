[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comicweaver"
version = "0.1.0"
description = "Multi-Agent comic creation system based on LangGraph + diffusion models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ComicWeaver Team" }
]
keywords = ["comic", "agent", "ai", "manga", "langgraph"]

dependencies = [
    "pydantic>=2.5",
    "gradio>=4.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
# Real LLM and image generation backends - lazy installed
agents = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
]
image = [
    "diffusers>=0.30.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.7",
]

[project.scripts]
comicweaver = "comicweaver.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comicweaver = ["configs/*.yaml", "review/rubrics/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
